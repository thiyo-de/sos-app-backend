services:
  - type: web
    name: sos-server
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false # Set in Render Dashboard
      - key: ADMIN_PASSWORD
        sync: false # Set in Render Dashboard
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard
      - key: SUPABASE_KEY
        sync: false # Set in Render Dashboard
      - key: WS_DEVICE_SECRET
        sync: false # Set in Render Dashboard
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false # Set in Render Dashboard (JSON string of service account)
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false # Alternative: base64-encoded service-account JSON
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        sync: false # Alternative: path to service-account JSON file on Render
    healthCheckPath: /health
